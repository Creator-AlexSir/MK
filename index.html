<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Стохастическая модель</title>
    <link href="main.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>Стохастическая модель</h1>
    </header>

    <!-- Уравнение -->
    <article>
      <div class="block">
        <h3>Уравнение модели</h3>
        <div class="formula-group">
          <input
            type="text"
            id="formula"
            class="formula-input"
            placeholder="Введите формулу"
            list="models"
          />
          <datalist id="models">
            <option value="x[t] = a0 + a1*t + a2*t^2"></option>
            <option value="x[t] = a0 + a1*t^2"></option>
            <option value="x[t] = a0 + a1 * sqrt(t)"></option>
            <option value="x[t] = a0 + a1 * x[t-1] + a2 * x[t-2]"></option>
          </datalist>

          <!-- Коэффициент N -->
          <div class="N-group">
            <label for="N">N:</label>
            <input
              type="number"
              id="N"
              class="N-input"
              value="20"
              max="1000"
              oninput="if (parseFloat(this.value) > 1000) this.value = 1000;"
            />
          </div>

          <!-- Коэффициент Wt -->
          <div class="Wt-group">
            <label for="Wt">Wₜ:</label>
            <input
              type="number"
              id="Wt"
              class="Wt-input"
              value="1"
              step="0.1"
              max="90000"
              oninput="if (parseFloat(this.value) > 90000) this.value = 90000;"
            />
          </div>
        </div>

        <!-- Панель объединения коэффициентов и графика -->
        <div class="general-panel">
          <!-- Панель коэффициентов модели -->
          <div class="coeff-panel">
            <h4>Коэффициенты модели</h4>
            <table class="coeff-table">
              <thead>
                <tr>
                  <th>Коэффициент</th>
                  <th>Теоретический</th>
                  <th>Расчетный</th>
                </tr>
              </thead>
              <tbody id="coeffs-table-body"></tbody>
            </table>
          </div>

          <!-- График -->
          <div class="graph-panel">
            <h3>График модели</h3>
            <div id="graf" class="graf"></div>

            <!-- Область под графиком -->
            <div class="button-group">
              <div id="x0-group" class="hidden">
                <label for="x0-input">X₀:</label>
                <input
                  type="number"
                  id="x0-input"
                  class="N-input"
                  value="0"
                  step="0.1"
                  max="90000"
                  oninput="
                    if (parseFloat(this.value) > 90000) this.value = 90000;
                  "
                />
              </div>
              <button id="generate-btn" class="calc-btn">
                Рассчитать данные
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Блок расчета данных -->
      <div id="direct-block" class="block">
        <div class="toggle-header">
          <h3>Расчитанные по коэффициентам данные</h3>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-direct" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div id="direct-content">
          <div
            id="generated-data-output"
            class="matrix-preview"
            style="margin-top: 14px"
          ></div>
        </div>
      </div>

      <!-- Блок расчета коэффициентов -->
      <div id="data-block" class="block">
        <div class="toggle-header">
          <h3>Данные для расчета коэффициентов</h3>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-data" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div id="data-content">
          <textarea
            id="y-data"
            rows="3"
            placeholder="Введите числа через пробел, запятую или с новой строки"
          ></textarea>
        </div>
      </div>
    </article>

    <footer>
      <p>© 2026 Лаборатория</p>
    </footer>

    <script src="main.js"></script>
    <script src="jquery.js"></script>
    <script src="jquery.flot.js"></script>
  </body>
</html>
