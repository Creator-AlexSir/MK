<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Стохастическая модель</title>
    <link href="main.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>Учебный тренажёр: стохастическая модель</h1>
    </header>

    <article class="layout">
      
      <div class="col col-left">
      
      <section class="card" id="equation-card">
        <h3>Уравнения модели</h3>

        <div class="equ-group">
          <div class="equ-row" id="row-x">
            <input
              type="text"
              id="formula-x"
              class="equ-input"
              placeholder="xₜ = "
              list="models-x"
            />
            <label class="noise-field" title="Множитель шума λ для x">
              λ<sub>x</sub>
              <input type="number" id="noise-x" class="noise-input" value="0" min="0" step="0.01" />
            </label>
          </div>

          <div class="equ-row hidden" id="row-y">
            <input
              type="text"
              id="formula-y"
              class="equ-input"
              placeholder="yₜ = "
              list="models-y"
            />
            <label class="noise-field" title="Множитель шума λ для y">
              λ<sub>y</sub>
              <input type="number" id="noise-y" class="noise-input" value="0" min="0" step="0.01" />
            </label>
          </div>

          <div class="equ-row hidden" id="row-z">
            <input
              type="text"
              id="formula-z"
              class="equ-input"
              placeholder="zₜ = "
              list="models-z"
            />
            <label class="noise-field" title="Множитель шума λ для z">
              λ<sub>z</sub>
              <input type="number" id="noise-z" class="noise-input" value="0" min="0" step="0.01" />
            </label>
          </div>

          <datalist id="models-x">
            <option value="x[t] = a0 + a1*t + a2*t^2"></option>
            <option value="x[t] = a0 + a1*t^2"></option>
            <option value="x[t] = a0 + a1 * sqrt(t)"></option>
            <option value="x[t] = a0 + a1 * x[t-1] + a2 * x[t-2]"></option>
            <option value="x[t] = a0 + a1*x[t-1] + a2*y[t-1]^2"></option>
          </datalist>

          <datalist id="models-y">
            <option value="y[t] = a3 + a4*t + a5*t^2"></option>
            <option value="y[t] = a3 + a4*x[t] + a5*t"></option>
            <option value="y[t] = a3 + a4*x[t] + a5*x[t-1]"></option>
            <option value="y[t] = a3 + a4*y[t-1] + a5*x[t]"></option>
            <option value="y[t] = a3 + a4*x[t-1]*y[t-1]"></option>
          </datalist>

          <datalist id="models-z">
            <option value="z[t] = a6 + a7*t + a8*t^2"></option>
            <option value="z[t] = a6 + a7*y[t] + a8*x[t]"></option>
            <option value="z[t] = a6 + a7*x[t] + a8*y[t]"></option>
            <option value="z[t] = a6 + a7*z[t-1] + a8*y[t]"></option>
          </datalist>
        </div>
      </section>

      <section class="card" id="coeff-card">
        <h3>Коэффициенты</h3>
        <div class="coeff-group" id="coeff-group"></div>
      </section>
      </div>

      <div class="col col-right">
      
      <section class="card" id="file-card">
        <div class="form-row">
          <span class="row-label">Данные из файла</span>
          <div class="file-input">
            <span class="file-name" id="file-name">файл не выбран</span>
            <button type="button" class="btn" id="file-btn">Выбрать…</button>
            <input
              type="file"
              class="hidden"
              id="hidden-file-input"
              accept=".txt,.csv,text/plain"
            />
          </div>
        </div>

        <div class="form-row">
          <label class="row-label" for="save-name">Сохранить ряды в</label>
          <input
            type="text"
            id="save-name"
            class="text-input"
            placeholder="series.txt (пусто — не сохранять)"
          />
        </div>

        <div class="form-row calc-button-group">
          <label class="row-label" for="N">N:</label>
          <input
            type="number"
            id="N"
            class="num-input"
            value="20"
            min="3"
            max="1000"
            oninput="if (parseFloat(this.value) > 1000) this.value = 1000;"
          />
          <button type="button" class="btn btn-primary" id="btn-calc">Рассчитать</button>
          <button type="button" class="btn btn-primary" id="btn-gen">Сгенерировать</button>
        </div>

        <p class="status" id="status"></p>
      </section>

      <section class="card" id="graph-card">
        <h3>График</h3>
        <div id="graf" class="graf"></div>
      </section>
      </div>

      <!-- Данные для расчета коэффициентов (отключено; ряды хранятся в dataText, main.js)
      <div class="card" id="data-card">
        <div class="toggle-header">
          <h3>Данные для расчета коэффициентов (x, y, z — по строкам)</h3>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-data" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div id="data-content">
          <textarea
            id="y-data"
            rows="6"
            placeholder="x:&#10;y:&#10;z:"
          ></textarea>
        </div>
      </div>
      -->
    </article>

    <script src="jquery.js"></script>
    <script src="jquery.flot.js"></script>
    <script src="main.js"></script>
  </body>
</html>
